[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
markers = ["integration: touches real project data files"]
addopts = "--cov=src --cov=azure --cov-report=term-missing"

[tool.coverage.run]
source = ["src", "azure"]
omit = ["src/rag/llm.py", "gradio_app.py", "src/rag/api.py"]
